[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The parked "immune system" pipeline (n-gram matcher, policy compiler, webhook server, GitOps,
# sandbox, eBPF capture, demo). Not published. The fingerprint tool it builds on is
# sketch-tastic (https://github.com/drusifer/sketch-tastic). See docs/SDLC.md.
[project]
name = "fingerling"
version = "0.8.0"
description = "Adaptive software immune system built on sketch-tastic (parked; not published)."
readme = "README.md"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "sketch-tastic",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The interactive vaccination TUI (examples/demo.py).
demo = ["rich>=13"]

[dependency-groups]
# Development tools; installed by `make install` (uv sync), never shipped.
dev = [
    "radon>=6.0.1",
    "ruff>=0.6",
    "vulture>=2.16",
]

[tool.uv.sources]
# Pinned to a pushed commit; to move to a newer sketch-tastic, change rev and run `uv lock`.
sketch-tastic = { git = "https://github.com/drusifer/sketch-tastic", rev = "6c4606ffe2a750470a8a29b4750e5ef8df3ec79a" }

[tool.hatch.build.targets.wheel]
packages = ["fingerling"]

[tool.ruff]
line-length = 100
target-version = "py314"
# agents/ is BobProtocol tooling, maintained in its own repository. Markdown is excluded so
# hand-aligned code sketches in the docs are left alone.
extend-exclude = ["agents", "*.md"]

[tool.ruff.lint]
# Baseline gate: real errors (pyflakes, syntax/runtime-level pycodestyle) and import order.
# Kept explicit so a ruff upgrade cannot silently widen the gate.
select = ["E4", "E7", "E9", "F", "I"]
