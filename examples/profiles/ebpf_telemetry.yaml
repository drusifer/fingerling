# yaml-language-server: $schema=../../packages/fingerprint-sampler/src/fingerprint_sampler/profile.schema.json
# Fingerprint profile for Tetragon-shaped eBPF process telemetry
# (the event shape `python -m fingerling.capture` emits).
version: 1

# fields define a fingerprint's identity: events with the same tokens share one fingerprint.
fields:
  - key: hook_syscall
    path: "$.process_kprobe.function_name"
    modifier: DEFAULT
  - key: exec_target
    path: "$.process_kprobe.args[0].exec_arg.filename"
    modifier: DEFAULT
  - key: kernel_return_state
    path: "$.process_kprobe.return_value"
    modifier: {name: IN_RANGE, low: -999, high: 0}

# aggregates are tracked per fingerprint and never change its identity.
aggregates:
  - key: duration_ms
    path: "$.duration_ms"
    fn: [MIN, MAX, AVG]
  - key: samples
    path: "$"
    fn: {name: LAST, n: 3}
